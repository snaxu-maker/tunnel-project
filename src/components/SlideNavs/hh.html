<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隧道管理系统 - 优化布局</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 240px;
            background-color: #1e293b;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar-brand {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #334155;
            background-color: #0f172a;
        }

        .sidebar-menu {
            list-style: none;
            padding: 16px 0;
            flex: 1;
            overflow-y: auto;
        }

        .menu-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #cbd5e1;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background-color: #334155;
            color: #fff;
        }

        .menu-item.active {
            background-color: #3b82f6;
            color: #fff;
            font-weight: 500;
        }

        /* 模拟图标占位 */
        .menu-icon {
            width: 16px;
            height: 16px;
            margin-right: 12px;
            border: 2px solid currentColor;
            border-radius: 3px;
            opacity: 0.8;
        }

        /* 主体内容布局 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航栏样式 */
        .header {
            height: 64px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb {
            font-size: 14px;
            color: #64748b;
        }

        .breadcrumb span {
            color: #1e293b;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
            color: #475569;
        }

        .dropdown {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .dropdown:hover {
            background-color: #f1f5f9;
        }

        /* 内容主体区域 */
        .content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* 优化后的卡片式内容块 */
        .card {
            background-color: #fff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            min-height: 400px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* 表单容器与网格布局 */
        .form-container {
            margin-top: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            /* 两列对等布局 */
            gap: 20px 32px;
            /* 上下间距20px，左右间距32px */
        }

        /* 响应式：屏幕较小时自动变为单列 */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* 标签和输入框的间距 */
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #475569;
        }

        .required {
            color: #ef4444;
            margin-left: 4px;
        }

        /* 输入框、选择框基础样式 */
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #fff;
            color: #1e293b;
            outline: none;
            transition: all 0.2s ease;
        }

        /* 鼠标悬停与聚焦交互 */
        .form-input:hover,
        .form-textarea:hover {
            border-color: #94a3b8;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-textarea {
            height: 100px;
            resize: vertical;
            /* 允许用户垂直拉伸 */
        }

        /* 按钮样式 */
        .form-actions {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        /* 表单验证错误样式 */
        .form-item.has-error .form-input,
        .form-item.has-error .form-textarea {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .form-item.has-error .form-input:focus,
        .form-item.has-error .form-textarea:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('tunnelForm');

            // 获取表单核心字段
            const tunnelName = document.getElementById('tunnelName');
            const tunnelCode = document.getElementById('tunnelCode');
            const tunnelLength = document.getElementById('tunnelLength');
            const btnCancel = document.getElementById('btnCancel');

            // 显示错误信息的通用函数
            function showError(inputElement, message) {
                const formItem = inputElement.closest('.form-item');
                formItem.classList.add('has-error');

                // 防止重复创建错误提示
                let errorDiv = formItem.querySelector('.error-message');
                if (!errorDiv) {
                    errorDiv = document.createElement('div');
                    errorDiv.className = 'error-message';
                    formItem.appendChild(errorDiv);
                }
                errorDiv.textContent = message;
            }

            // 清除错误信息的通用函数
            function clearError(inputElement) {
                const formItem = inputElement.closest('.form-item');
                formItem.classList.remove('has-error');
                const errorDiv = formItem.querySelector('.error-message');
                if (errorDiv) {
                    errorDiv.remove();
                }
            }

            // 核心校验逻辑
            function validateForm() {
                let isValid = true;

                // 1. 校验隧道名称 (必填)
                if (!tunnelName.value.trim()) {
                    showError(tunnelName, '隧道名称不能为空');
                    isValid = false;
                } else {
                    clearError(tunnelName);
                }

                // 2. 校验工程编码 (必填 + 正则匹配格式)
                const codeReg = /^TN-\d{4}-\d{3}$/; // 匹配 TN-XXXX-XXX 格式
                if (!tunnelCode.value.trim()) {
                    showError(tunnelCode, '工程编码不能为空');
                    isValid = false;
                } else if (!codeReg.test(tunnelCode.value.trim())) {
                    showError(tunnelCode, '编码格式不正确，标准格式如：TN-2026-001');
                    isValid = false;
                } else {
                    clearError(tunnelCode);
                }

                // 3. 校验设计全长 (必填 + 大于0的数字)
                const lengthVal = parseFloat(tunnelLength.value);
                if (!tunnelLength.value.trim()) {
                    showError(tunnelLength, '设计全长不能为空');
                    isValid = false;
                } else if (isNaN(lengthVal) || lengthVal <= 0) {
                    showError(tunnelLength, '请输入大于 0 的有效数字');
                    isValid = false;
                } else {
                    clearError(tunnelLength);
                }

                return isValid;
            }

            // 监听表单提交事件
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // 阻止浏览器默认提交/刷新行为

                if (validateForm()) {
                    // 验证通过，构建提交数据
                    const formData = {
                        name: tunnelName.value.trim(),
                        code: tunnelCode.value.trim(),
                        type: document.getElementById('tunnelType').value,
                        length: parseFloat(tunnelLength.value),
                        description: document.getElementById('tunnelDesc').value.trim()
                    };

                    console.log('表单验证成功，准备提交的数据：', formData);
                    alert('🎉 表单验证成功，数据已提交（请在控制台查看打印输出）！');

                    // 这里可以发起实际的后端请求，例如：
                    // fetch('/api/tunnel', { method: 'POST', body: JSON.stringify(formData) })
                } else {
                    // 滚动到第一个发生错误的输入框
                    const firstError = form.querySelector('.has-error');
                    if (firstError) {
                        firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            });

            // 输入时实时清除错误提示 (提升用户体验)
            const inputs = [tunnelName, tunnelCode, tunnelLength];
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    // 如果当前输入框有错误，输入时直接移除错误状态
                    if (input.closest('.form-item').classList.contains('has-error')) {
                        clearError(input);
                    }
                });
            });

            // 取消按钮点击事件
            btnCancel.addEventListener('click', () => {
                if (confirm('确定要放弃当前输入的内容吗？')) {
                    form.reset();
                    // 清除所有的错误样式
                    inputs.forEach(input => clearError(input));
                }
            });
        });
    </script>

</head>

<body>

    <!-- 左侧固定边栏 -->
    <aside class="sidebar">
        <div class="sidebar-brand">隧道管理系统</div>
        <ul class="sidebar-menu">
            <li class="menu-item active">
                <div class="menu-icon"></div>首页
            </li>
            <li class="menu-item">
                <div class="menu-icon"></div>项目基础信息
            </li>
            <li class="menu-item">
                <div class="menu-icon"></div>隧道设计信息
            </li>
            <li class="menu-item">
                <div class="menu-icon"></div>工作监督管理
            </li>
            <li class="menu-item">
                <div class="menu-icon"></div>施工监控检测
            </li>
            <li class="menu-item">
                <div class="menu-icon"></div>超前地质预报
            </li>
            <li class="menu-item">
                <div class="menu-icon"></div>系统信息管理
            </li>
        </ul>
    </aside>

    <!-- 右侧内容容器 -->
    <div class="main-container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <div class="breadcrumb">当前 / <span>首页</span></div>
            </div>
            <div class="header-right">
                <div class="dropdown">语言 ▾</div>
                <div class="dropdown">xu ▾</div>
            </div>
        </header>

        <!-- 页面主内容 -->
        <main class="content">
            <div class="card">
                <div class="card-title">新增隧道工程基础信息</div>

                <form class="form-container" id="tunnelForm" novalidate>
                    <!-- 表单行：2列网格 -->
                    <div class="form-grid">
                        <div class="form-item">
                            <label class="form-label">隧道名称 <span class="required">*</span></label>
                            <input type="text" id="tunnelName" class="form-input" placeholder="请输入隧道完整名称">
                        </div>
                        <div class="form-item">
                            <label class="form-label">工程编码 <span class="required">*</span></label>
                            <input type="text" id="tunnelCode" class="form-input" placeholder="如：TN-2026-001">
                        </div>
                        <div class="form-item">
                            <label class="form-label">隧道类型</label>
                            <select id="tunnelType" class="form-input">
                                <option value="">请选择类型</option>
                                <option value="1">特长隧道 (＞3000m)</option>
                                <option value="2">长隧道 (1000m-3000m)</option>
                                <option value="3">中隧道 (500m-1000m)</option>
                                <option value="4">短隧道 (＜500m)</option>
                            </select>
                        </div>
                        <div class="form-item">
                            <label class="form-label">设计全长 (米) <span class="required">*</span></label>
                            <input type="number" id="tunnelLength" class="form-input" placeholder="请输入大于0的数字">
                        </div>
                    </div>

                    <!-- 单独全宽行 -->
                    <div class="form-item" style="margin-top: 20px;">
                        <label class="form-label">施工单位说明</label>
                        <textarea id="tunnelDesc" class="form-textarea"
                            placeholder="请填写负责该标段的施工单位及核心负责人信息..."></textarea>
                    </div>

                    <!-- 底部操作按钮 -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnCancel">取消</button>
                        <button type="submit" class="btn btn-primary">提交保存</button>
                    </div>
                </form>


            </div>
        </main>

    </div>

</body>

</html>
